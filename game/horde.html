<title>Dust Horde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
  :root{
    --night:#16130f;
    --panel:#1f1b16;
    --panel-2:#2a241d;
    --line:#4a3d2d;
    --sand:#e3c68b;
    --dust:#a87f4a;
    --plasma:#46e0d2;
    --gold:#ffc53d;
    --blood:#c6362f;
    --ink:#f3e9d8;
    --ink-dim:#a2947f;
    --r-common:#9aa08d;
    --r-rare:#5aa9e6;
    --r-epic:#b07de8;
    --r-legend:#ffa53c;
    --display:"Bungee","Arial Black",system-ui,sans-serif;
    --ui:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    background:var(--night);color:var(--ink);font-family:var(--ui);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:12px;overflow:hidden;
  }

  #cab{
    position:relative;width:min(460px,100vw - 24px);height:min(860px,100vh - 24px);
    border-radius:18px;overflow:hidden;background:var(--panel);
    box-shadow:0 0 0 2px #3a3128, 0 26px 60px rgba(0,0,0,.6);
    touch-action:none;user-select:none;
  }
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:6px;padding:10px}
  .bar{height:12px;border:2px solid #0c0a08;background:#0c0a08;position:relative;overflow:hidden}
  .bar > i{display:block;height:100%;width:100%;transform-origin:left;transition:transform .12s linear}
  #hpFill{background:linear-gradient(180deg,#e15a4c,var(--blood))}
  #xpFill{background:linear-gradient(180deg,#8ff5ea,var(--plasma))}
  #xpBar{height:7px}
  .row{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.04em}
  .stat{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.6)}
  .stat b{font-family:var(--display);font-size:15px;font-weight:400}
  .stat span{color:var(--ink-dim);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  .gold{color:var(--gold)}
  #waveTag{margin-left:auto;font-family:var(--display);font-size:13px;color:var(--sand);text-shadow:0 2px 0 rgba(0,0,0,.6)}
  #bossWrap{display:none;gap:4px;flex-direction:column}
  #bossWrap.on{display:flex}
  #bossBar{height:9px;border-color:#2a0f0d;background:#2a0f0d}
  #bossFill{background:linear-gradient(180deg,#ff8a5c,#8e1f1a)}
  #bossName{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#e6a08c}
  #escWrap{display:none;gap:3px;flex-direction:column}
  #escWrap.on{display:flex}
  #escBar{height:8px;border-color:#2b2410;background:#2b2410}
  #escFill{background:linear-gradient(180deg,#ffe08a,#c9a227)}
  #escName{font-size:10px;letter-spacing:.1em;color:#e0c07a}
  #slots{display:flex;gap:4px;margin-top:auto}
  .slot{
    width:34px;height:34px;display:grid;place-items:center;background:rgba(12,10,8,.6);
    border:2px solid rgba(74,61,45,.9);font-family:var(--display);font-size:10px;color:var(--ink-dim);
    position:relative;
  }
  .slot.filled{color:var(--plasma);border-color:var(--line)}
  .slot.evo{color:var(--gold);border-color:var(--gold)}
  .slot i{position:absolute;right:1px;bottom:0;font-style:normal;font-size:9px;font-family:var(--ui);font-weight:700;color:var(--sand)}

  #banner{
    position:absolute;left:0;right:0;top:32%;text-align:center;
    font-family:var(--display);font-size:30px;color:var(--sand);
    text-shadow:0 4px 0 rgba(0,0,0,.55);opacity:0;pointer-events:none;
  }
  #banner.show{animation:pop 1.7s ease-out}
  @keyframes pop{0%{opacity:0;transform:scale(.8)}14%{opacity:1;transform:scale(1.04)}74%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

  /* ---------- overlays ---------- */
  .overlay{
    position:absolute;inset:0;display:none;flex-direction:column;gap:12px;padding:20px;
    background:rgba(12,10,8,.9);backdrop-filter:blur(2px);overflow-y:auto;
  }
  .overlay.on{display:flex}
  .overlay.mid{justify-content:center}
  .eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--plasma)}
  h1{font-family:var(--display);font-size:38px;line-height:.98;margin:0;text-wrap:balance;color:var(--sand)}
  h2{font-family:var(--display);font-size:22px;margin:0;color:var(--ink)}
  p{margin:0;font-size:13px;line-height:1.65;color:var(--ink-dim);max-width:34ch}
  kbd{font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--ink)}

  button{
    font-family:var(--display);font-size:14px;color:var(--night);background:var(--sand);
    border:0;border-bottom:4px solid var(--dust);padding:12px 16px;cursor:pointer;
  }
  button:hover{background:#f0d59d}
  button:active{transform:translateY(2px);border-bottom-width:2px}
  button:focus-visible{outline:3px solid var(--plasma);outline-offset:2px}
  button[disabled]{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
  button.ghost:hover{background:var(--panel-2)}

  .cards{display:flex;flex-direction:column;gap:8px}
  .card{
    display:flex;align-items:center;gap:11px;text-align:left;width:100%;
    background:var(--panel-2);border:2px solid var(--line);border-bottom-width:4px;
    padding:10px 12px;cursor:pointer;color:var(--ink);font-family:var(--ui);
  }
  .card:hover:not([disabled]){border-color:var(--plasma);background:#332b21}
  .card .glyph{
    flex:0 0 38px;height:38px;display:grid;place-items:center;background:#141210;
    font-family:var(--display);font-size:14px;
  }
  .card h3{margin:0;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .card small{display:block;color:var(--ink-dim);font-size:11.5px;line-height:1.45}
  .card .tail{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .price{font-family:var(--display);font-size:14px;color:var(--gold)}
  .tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
  .rc{color:var(--r-common)} .rr{color:var(--r-rare)} .re{color:var(--r-epic)} .rl{color:var(--r-legend)}
  .bc{border-color:var(--r-common)} .br{border-color:var(--r-rare)} .be{border-color:var(--r-epic)} .bl{border-color:var(--r-legend)}

  .inv{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:10px;letter-spacing:.06em;border:1px solid var(--line);padding:2px 6px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .chip.w{color:var(--plasma);border-color:#2f4f4c}
  .chip.w.evo{color:var(--gold);border-color:var(--gold)}
  .shopbar{display:flex;align-items:center;gap:8px}
  .shopbar .purse{margin-left:auto;font-family:var(--display);font-size:18px;color:var(--gold);font-variant-numeric:tabular-nums}
  .foot{display:flex;gap:8px;margin-top:auto;padding-top:4px}
  .foot button{flex:1}

  .results{display:flex;flex-wrap:wrap;gap:8px 22px}
  .results div{font-variant-numeric:tabular-nums}
  .results b{font-family:var(--display);font-size:20px;font-weight:400;display:block;color:var(--sand)}
  .results span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}

  #cardWrap{display:flex;flex-direction:column;gap:8px}
  #cardImg{width:100%;display:block;border:2px solid var(--line);background:#1f1b16}
  #shareNote{font-size:11px;color:var(--plasma);min-height:14px;letter-spacing:.04em}
  .seedline{font-size:11px;color:var(--ink-dim);letter-spacing:.1em;font-variant-numeric:tabular-nums}
  .talent{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--line);padding:9px 11px}
  .talent .meter{display:flex;gap:2px;margin-top:4px}
  .talent .meter i{width:11px;height:4px;background:#141210;display:block}
  .talent .meter i.on{background:var(--plasma)}
  .talent button{flex:0 0 auto;font-size:11px;padding:8px 10px}

  @media (prefers-reduced-motion:reduce){#banner.show{animation-duration:.01ms}}
</style>

<div id="cab">
  <canvas id="cv"></canvas>

  <div id="hud">
    <div class="bar" id="hpBar"><i id="hpFill"></i></div>
    <div class="bar" id="xpBar"><i id="xpFill"></i></div>
    <div class="row">
      <div class="stat"><b id="lv">1</b><span>lv</span></div>
      <div class="stat"><b id="kills">0</b><span>kills</span></div>
      <div class="stat gold"><b id="coins">0</b><span>coin</span></div>
      <div id="waveTag">WAVE 1 · 0:30</div>
    </div>
    <div id="bossWrap">
      <div id="bossName">ROTLORD</div>
      <div class="bar" id="bossBar"><i id="bossFill"></i></div>
    </div>
    <div id="escWrap">
      <div id="escName">護衛対象 — ウェーブ終了まで守れ</div>
      <div class="bar" id="escBar"><i id="escFill"></i></div>
    </div>
    <div id="slots"></div>
    <div id="banner"></div>
  </div>

  <div class="overlay mid on" id="startScreen">
    <div class="eyebrow">Horde survival</div>
    <h1>DUST<br>HORDE</h1>
    <p>荒野に湧く屍の群れ。攻撃は全自動。<b>避けて、拾って、ウェーブ間に買う</b>。武器はMAX＋鍵アイテムで<b>進化</b>する。</p>
    <p>移動：ドラッグ／<kbd>WASD</kbd><kbd>←↑↓→</kbd>　停止：<kbd>P</kbd></p>
    <div class="foot" style="margin-top:8px">
      <button id="startBtn">出撃する</button>
      <button class="ghost" id="dailyBtn">今日の挑戦</button>
    </div>
    <div style="display:flex"><button class="ghost" id="talentBtn" style="flex:1">恒久強化</button></div>
    <div class="seedline" id="dailyNote"></div>
  </div>

  <div class="overlay mid" id="levelScreen">
    <div class="eyebrow">Level up</div>
    <h2 id="lvTitle">強化を選べ</h2>
    <div class="cards" id="lvCards"></div>
  </div>

  <div class="overlay" id="shopScreen">
    <div class="shopbar">
      <div>
        <div class="eyebrow">Between waves</div>
        <h2 id="shopTitle">補給</h2>
      </div>
      <div class="purse"><span id="shopCoins">0</span><span style="font-size:11px"> ¤</span></div>
    </div>
    <div class="inv" id="shopInv"></div>
    <div class="cards" id="shopCards"></div>
    <div class="foot">
      <button class="ghost" id="rerollBtn">引き直し 6¤</button>
      <button id="goBtn">次のウェーブ</button>
    </div>
  </div>

  <div class="overlay" id="overScreen">
    <div class="eyebrow" id="overEyebrow">Overrun</div>
    <div id="cardWrap">
      <img id="cardImg" alt="ランの結果カード">
      <div id="shareNote"></div>
    </div>
    <div class="foot">
      <button id="shareBtn">結果を共有</button>
      <button class="ghost" id="againBtn">もう一度</button>
    </div>
    <div style="display:flex"><button class="ghost" id="talentBtn2" style="flex:1">恒久強化</button></div>
  </div>

  <div class="overlay" id="talentScreen">
    <div class="shopbar">
      <div>
        <div class="eyebrow">Permanent</div>
        <h2>恒久強化</h2>
      </div>
      <div class="purse"><span id="bankCoins">0</span><span style="font-size:11px"> ¤</span></div>
    </div>
    <p>ランで稼いだコインは全滅時に貯まる。ここでの強化は次のランから常に効く。</p>
    <div class="cards" id="talentList"></div>
    <div class="foot"><button id="talentBack">戻る</button></div>
  </div>

  <div class="overlay mid" id="pauseScreen">
    <div class="eyebrow">Paused</div>
    <h2>一時停止</h2>
    <div><button id="resumeBtn">再開</button></div>
  </div>
</div>

<script>
(() => {
"use strict";

// =====================================================================
//  Dust Horde — horde survivor
//  ラン内 : 自動攻撃 → ドロップ → レベルアップ(ステータス)
//  ラン内 : ウェーブ終了 → ショップ(武器スロット/アイテム) → 進化
//  ラン外 : 全滅でコインが貯まる → タレント(恒久強化)
// =====================================================================

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d", { alpha: false });
const cab = document.getElementById("cab");
const el = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = cab.clientWidth; H = cab.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize);
resize();

// ---------- ground tile ----------
const tile = document.createElement("canvas");
tile.width = tile.height = 128;
{
  const t = tile.getContext("2d");
  t.fillStyle = "#d8b87c"; t.fillRect(0, 0, 128, 128);
  let s = 7;
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 900; i++) {
    t.fillStyle = rnd() < .5 ? "rgba(168,127,74,.30)" : "rgba(240,220,175,.30)";
    t.fillRect(rnd() * 128 | 0, rnd() * 128 | 0, 1 + (rnd() * 2 | 0), 1);
  }
  for (let i = 0; i < 14; i++) {
    t.fillStyle = "rgba(120,88,50,.07)";
    t.beginPath(); t.arc(rnd() * 128, rnd() * 128, 2 + rnd() * 5, 0, 7); t.fill();
  }
}
const groundPat = ctx.createPattern(tile, "repeat");

// =====================================================================
//  content tables — バランスはここを触るだけで全部変わる
// =====================================================================
const WAVE_LEN = 30;
const SPAWN_CAP = 900;
const CELL = 26;
const SLOTS = 6;
const WMAX = 5;               // 武器の最大レベル（ここで進化可能に）

const TYPES = {
  walker: { r: 7,  hp: 6,   spd: 52, dmg: 9,  col: "#4a4f42", head: "#798a5c", xp: 1 },
  runner: { r: 6,  hp: 6,   spd: 96, dmg: 7,  col: "#5b4442", head: "#a06a4e", xp: 1 },
  brute:  { r: 13, hp: 62,  spd: 40, dmg: 22, col: "#3c4a3a", head: "#6f9350", xp: 5, armor: .5 },
  spitter:{ r: 8,  hp: 13,  spd: 44, dmg: 6,  col: "#46583a", head: "#b6d84a", xp: 2, range: 235 },
  bomber: { r: 9,  hp: 9,   spd: 94, dmg: 8,  col: "#6b3a2e", head: "#e2a33c", xp: 2, boom: true },
  breaker:{ r: 12, hp: 44,  spd: 46, dmg: 16, col: "#4a3a28", head: "#c08a4a", xp: 3, breaker: true },
  mason:  { r: 9,  hp: 24,  spd: 54, dmg: 8,  col: "#2f4450", head: "#6fb5c9", xp: 3, mason: true },
  flyer:  { r: 7,  hp: 11,  spd: 88, dmg: 11, col: "#3d3550", head: "#9b8ad6", xp: 2, fly: true },
  boss:   { r: 34, hp: 430, spd: 30, dmg: 34, col: "#3f5a30", head: "#8fd14a", xp: 60 },
};


// =====================================================================
//  map — グリッド地形・フローフィールド経路探索・射線判定
//  A* は「1体につき1回」探索するので数百体では破綻する。
//  ここでは目的地が常にプレイヤー1点なので、マップ全体に距離場を一度だけ
//  作り、敵は自分のマスの勾配を下るだけにする（コストは敵の数と無関係）。
// =====================================================================
const TILE = 26;
const FLOOR = { NONE: 0, SWAMP: 1, POISON: 2, ICE: 3, THORN: 4 };
const FLOOR_COL  = ["", "#4a6b3f", "#6a4a7d", "#93c9de", "#8a3b2f"];
const FLOOR_EDGE = ["", "#6f9459", "#9c72b5", "#d3ecf6", "#c25a45"];
const FLOOR_NAME = ["", "沼", "毒", "氷", "茨"];

let MW = 60, MH = 60;                  // 部屋の広さ（マス）
let solid = new Uint8Array(MW * MH);     // 0=通行可 1=岩 2=壊せる壁
let wallHp = new Float32Array(MW * MH);
let ground = new Uint8Array(MW * MH);
let fdist = new Int32Array(MW * MH);   // プレイヤーまでの距離（マス数）
let fqueue = new Int32Array(MW * MH);
let flowTile = -1, flowT = 0;

const idx = (tx, ty) => ty * MW + tx;
const inMap = (tx, ty) => tx >= 0 && ty >= 0 && tx < MW && ty < MH;
function solidAt(x, y) {
  const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
  if (!inMap(tx, ty)) return true;
  return solid[idx(tx, ty)] === 1;
}
function floorAt(x, y) {
  const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
  if (!inMap(tx, ty)) return FLOOR.NONE;
  return ground[idx(tx, ty)];
}
const mapW = () => MW * TILE, mapH = () => MH * TILE;

// --- 部屋の生成 ---------------------------------------------------
function fillRect(tx, ty, w, h, v) {
  for (let y = ty; y < ty + h; y++) for (let x = tx; x < tx + w; x++) {
    if (!inMap(x, y)) continue;
    solid[idx(x, y)] = v;
    if (v === 2) wallHp[idx(x, y)] = 26 * Math.pow(1.18, wave - 1);
  }
}
// 壁を削る。壊れたら流れ場を作り直す（＝道が変わる）
function hitWall(x, y, dmg) {
  const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
  if (!inMap(tx, ty)) return false;
  const i = idx(tx, ty);
  if (solid[i] !== 2) return false;
  wallHp[i] -= dmg;
  if (wallHp[i] <= 0) {
    solid[i] = 0; wallHp[i] = 0; flowTile = -1;
    burst(tx * TILE + TILE / 2, ty * TILE + TILE / 2, 8, "#8a7250", 130);
  }
  return true;
}
function blob(r, type, cx, cy, rad) {
  for (let y = cy - rad; y <= cy + rad; y++) for (let x = cx - rad; x <= cx + rad; x++) {
    if (!inMap(x, y)) continue;
    const d = Math.hypot(x - cx, y - cy);
    if (d < rad * (.65 + r() * .5) && !solid[idx(x, y)]) ground[idx(x, y)] = type;
  }
}
const ROOMS = ["open", "pillars", "cross", "corridors", "arena"];

function buildRoom(w) {
  const r = stream("room", w);
  // ウェーブが進むほど戦場が狭くなる＝数値をいじらずに難易度を上げる
  MW = MH = 72;                       // ランを通して1枚。狭くなるのは崩落する外周でやる
  solid = new Uint8Array(MW * MH);
  wallHp = new Float32Array(MW * MH);
  ground = new Uint8Array(MW * MH);
  fdist = new Int32Array(MW * MH);
  fqueue = new Int32Array(MW * MH);
  flowTile = -1;

  fillRect(0, 0, MW, 2, 1); fillRect(0, MH - 2, MW, 2, 1);
  fillRect(0, 0, 2, MH, 1); fillRect(MW - 2, 0, 2, MH, 1);

  const kind = w === 1 ? "open" : ROOMS[(r() * ROOMS.length) | 0];
  const cx = MW >> 1, cy = MH >> 1;

  if (kind === "pillars") {
    const step = 8 + ((r() * 3) | 0);
    for (let y = 6; y < MH - 6; y += step) for (let x = 6; x < MW - 6; x += step) {
      if (Math.hypot(x - cx, y - cy) < 5) continue;
      const sz = 2 + ((r() * 2) | 0);
      fillRect(x, y, sz, sz, 1);
    }
  } else if (kind === "cross") {
    const gap = 5;
    fillRect(cx - 1, 4, 3, cy - 4 - gap, 1);
    fillRect(cx - 1, cy + gap, 3, MH - 4 - cy - gap, 1);
    fillRect(4, cy - 1, cx - 4 - gap, 3, 1);
    fillRect(cx + gap, cy - 1, MW - 4 - cx - gap, 3, 1);
  } else if (kind === "corridors") {
    for (let y = 8; y < MH - 8; y += 9) {
      const hole = 5 + ((r() * (MW - 16)) | 0);
      fillRect(4, y, MW - 8, 2, 1);
      fillRect(hole, y, 6, 2, 0);            // 通り抜けられる口
      fillRect(hole + 12 > MW - 8 ? 6 : hole + 12, y, 5, 2, 0);
    }
  } else if (kind === "arena") {
    const R = Math.min(MW, MH) * .46;
    for (let y = 2; y < MH - 2; y++) for (let x = 2; x < MW - 2; x++) {
      const d = Math.hypot(x - cx, y - cy);
      if (d > R) solid[idx(x, y)] = 1;
    }
    for (let k = 0; k < 5; k++) {           // 円の中に岩を少し
      const a = r() * 6.2832, rr = r() * R * .7;
      fillRect((cx + Math.cos(a) * rr) | 0, (cy + Math.sin(a) * rr) | 0, 2, 2, 1);
    }
  }
  // どの部屋にも岩を散らす
  const rocks = 34 + ((r() * 26) | 0);
  for (let k = 0; k < rocks; k++) {
    const x = 5 + ((r() * (MW - 10)) | 0), y = 5 + ((r() * (MH - 10)) | 0);
    if (Math.hypot(x - cx, y - cy) < 6) continue;
    // 3割は壊せる壁。火力で道を作れる＝ビルドが移動性能になる
    fillRect(x, y, 1 + ((r() * 4) | 0), 1 + ((r() * 4) | 0), r() < .3 ? 2 : 1);
  }
  // 床属性：通れるが代償がある区画
  const kinds = [FLOOR.SWAMP, FLOOR.POISON, FLOOR.ICE, FLOOR.THORN];
  const patches = 9 + ((r() * 7) | 0);
  for (let k = 0; k < patches; k++) {
    const t = kinds[(r() * kinds.length) | 0];
    const x = 6 + ((r() * (MW - 12)) | 0), y = 6 + ((r() * (MH - 12)) | 0);
    if (Math.hypot(x - cx, y - cy) < 5) continue;
    blob(r, t, x, y, 3 + ((r() * 5) | 0));
  }
  // 中央は必ず安全に開けておく（開幕の詰みを防ぐ）
  for (let y = cy - 3; y <= cy + 3; y++) for (let x = cx - 3; x <= cx + 3; x++) {
    if (inMap(x, y)) { solid[idx(x, y)] = 0; ground[idx(x, y)] = 0; }
  }
  const home = { x: cx * TILE + TILE / 2, y: cy * TILE + TILE / 2 };
  placeProps(w, r, home);
  return home;
}

// --- フローフィールド ------------------------------------------------
function rebuildFlow() {
  let px = (P.x / TILE) | 0, py = (P.y / TILE) | 0;
  px = Math.max(1, Math.min(MW - 2, px)); py = Math.max(1, Math.min(MH - 2, py));
  if (solid[idx(px, py)]) {                    // 壁に埋まっていたら近い空きへ
    outer:
    for (let rad = 1; rad < 6; rad++) {
      for (let y = py - rad; y <= py + rad; y++) for (let x = px - rad; x <= px + rad; x++) {
        if (inMap(x, y) && !solid[idx(x, y)]) { px = x; py = y; break outer; }
      }
    }
  }
  fdist.fill(-1);
  let head = 0, tail = 0;
  const start = idx(px, py);
  fdist[start] = 0; fqueue[tail++] = start;
  while (head < tail) {
    const c = fqueue[head++];
    const cx = c % MW, cy = (c / MW) | 0, d = fdist[c] + 1;
    if (cx > 0)      { const i = c - 1;  if (!solid[i] && fdist[i] < 0) { fdist[i] = d; fqueue[tail++] = i; } }
    if (cx < MW - 1) { const i = c + 1;  if (!solid[i] && fdist[i] < 0) { fdist[i] = d; fqueue[tail++] = i; } }
    if (cy > 0)      { const i = c - MW; if (!solid[i] && fdist[i] < 0) { fdist[i] = d; fqueue[tail++] = i; } }
    if (cy < MH - 1) { const i = c + MW; if (!solid[i] && fdist[i] < 0) { fdist[i] = d; fqueue[tail++] = i; } }
  }
  flowTile = start;
}
// 自分のマスから見て一番プレイヤーに近い隣マスの向き
function flowDir(x, y, out) {
  const tx = (x / TILE) | 0, ty = (y / TILE) | 0;
  out.x = 0; out.y = 0;
  if (!inMap(tx, ty)) return out;
  let best = fdist[idx(tx, ty)], bx = 0, by = 0;
  if (best < 0) best = 1e9;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    if (!ox && !oy) continue;
    const nx = tx + ox, ny = ty + oy;
    if (!inMap(nx, ny)) continue;
    const d = fdist[idx(nx, ny)];
    if (d < 0) continue;
    // 斜めは角抜けを禁止（壁の角をすり抜けない）
    if (ox && oy && (solid[idx(tx + ox, ty)] || solid[idx(tx, ty + oy)])) continue;
    if (d < best) { best = d; bx = ox; by = oy; }
  }
  const m = Math.hypot(bx, by) || 1;
  out.x = bx / m; out.y = by / m;
  return out;
}

// --- 射線判定（自動攻撃・敵の追跡の両方で使う） ------------------------
function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if (len < 1) return true;
  const steps = Math.min(96, Math.ceil(len / (TILE * .5)));
  const sx = dx / steps, sy = dy / steps;
  let x = x0, y = y0;
  for (let i = 0; i < steps; i++) {
    x += sx; y += sy;
    if (solidAt(x, y)) return false;
  }
  return true;
}

// --- 壁に沿って動く（軸ごとに解決＝壁に張り付いても滑る） --------------
function moveEnt(o, mx, my) {
  if (mx) {
    const nx = o.x + mx;
    if (!solidAt(nx + Math.sign(mx) * o.r, o.y)) o.x = nx;
  }
  if (my) {
    const ny = o.y + my;
    if (!solidAt(o.x, ny + Math.sign(my) * o.r)) o.y = ny;
  }
}

// =====================================================================
//  props — 地形に置かれるモノ：爆発ドラム／湧き穴／制圧ポイント／護衛対象
// =====================================================================
let props = [];
let pointCd = 0;

function freeSpot(r, cx, cy, minDist) {
  const mcx = MW / 2, mcy = MH / 2, inner = (collapseR() / TILE) * .88;
  for (let i = 0; i < 120; i++) {
    const tx = 3 + ((r() * (MW - 6)) | 0), ty = 3 + ((r() * (MH - 6)) | 0);
    if (solid[idx(tx, ty)] || ground[idx(tx, ty)]) continue;
    if (Math.hypot(tx - cx, ty - cy) < minDist) continue;
    if (Math.hypot(tx - mcx, ty - mcy) > inner) continue;
    return { x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 };
  }
  return null;
}
function placeProps(w, r, home) {
  props = []; pointCd = 0;
  const cx = MW >> 1, cy = MH >> 1;
  const sc = Math.pow(1.27, w - 1);

  const barrels = 7 + ((r() * 6) | 0);              // 爆発ドラム：地形が武器になる
  for (let i = 0; i < barrels; i++) {
    const p = freeSpot(r, cx, cy, 5);
    if (p) props.push({ kind: "barrel", x: p.x, y: p.y, r: 12, hp: 16, maxHp: 16 });
  }
  if (w >= 4) {                                     // 湧き穴：壊せば湧きが止まる
    const n = Math.min(4, 1 + ((w / 4) | 0));
    for (let i = 0; i < n; i++) {
      const p = freeSpot(r, cx, cy, 9);
      if (p) props.push({ kind: "spawner", x: p.x, y: p.y, r: 16, hp: 70 * sc, maxHp: 70 * sc, cd: 2 + r() * 2 });
    }
  }
  if (w >= 2) {                                     // 制圧ポイント：立ち止まる理由
    const p = freeSpot(r, cx, cy, 7);
    if (p) props.push({ kind: "point", x: p.x, y: p.y, r: 76, fill: 0 });
  }
  if (w >= 4 && w % 4 === 0) {                      // 護衛対象：置き去りにできない
    const hp = 700 * sc;
    props.push({ kind: "escort", x: home.x + 40, y: home.y + 40, r: 15, hp, maxHp: hp, spd: 74 });
  }
}


// ウェーブの切れ目に落ちてくる補給。群れを押し戻して隙間を作り、物資を置いていく
function supplyDrop() {
  const R = 230;
  parts.push({ ring: true, x: P.x, y: P.y, r0: 12, r1: R, t: .5, max: .5 });
  if (!reduceMotion) { shake = 14; hitStop = .06; }
  for (const e of enemies) {
    const dx = e.x - P.x, dy = e.y - P.y, d = Math.hypot(dx, dy) || 1;
    if (d > R) continue;
    const push = (1 - d / R) * 210;          // 殺さずに押しのける＝理不尽な即死を作らない
    moveEnt(e, dx / d * push, dy / d * push);
    e.hit = .12;
  }
  const r = stream("supply", wave);
  const cx = (P.x / TILE) | 0, cy = (P.y / TILE) | 0;
  for (let i = 0; i < 2; i++) {              // ドラムの補充
    const p = freeSpot(r, cx, cy, 6);
    if (p) props.push({ kind: "barrel", x: p.x, y: p.y, r: 12, hp: 16, maxHp: 16 });
  }
  const holes = props.filter(p => p.kind === "spawner" && !p.dead).length;
  if (wave >= 4 && holes < Math.min(4, 1 + ((wave / 4) | 0))) {
    const p = freeSpot(r, cx, cy, 10);       // 新しい湧き穴が開く
    if (p) {
      const hp = 70 * Math.pow(1.27, wave - 1);
      props.push({ kind: "spawner", x: p.x, y: p.y, r: 16, hp, maxHp: hp, cd: 3 });
      parts.push({ ring: true, x: p.x, y: p.y, r0: 4, r1: 60, t: .5, max: .5 });
    }
  }
  if (!props.some(p => p.kind === "point" && !p.dead) && pointCd <= 0 && wave >= 2) {
    const p = freeSpot(r, cx, cy, 8);
    if (p) props.push({ kind: "point", x: p.x, y: p.y, r: 76, fill: 0 });
  }
  if (wave >= 4 && wave % 4 === 0 && !props.some(p => p.kind === "escort" && !p.dead)) {
    const hp = 700 * Math.pow(1.27, wave - 1);
    props.push({ kind: "escort", x: P.x + 40, y: P.y + 40, r: 15, hp, maxHp: hp, spd: 82, calm: 0 });
  }
}

// 外周の崩落。マップは1枚のまま、使える範囲だけがウェーブごとに狭くなる
function collapseR() {
  const maxR = (Math.min(MW, MH) * TILE) / 2 - TILE * 2;
  return Math.max(TILE * 12, maxR * (1 - .045 * Math.max(0, wave - 3)));
}

function damageProp(p, dmg) {
  if (p.dead || p.kind === "point") return;
  p.hp -= dmg;
  p.hit = .1;
  if (p.hp <= 0) {
    p.dead = true;
    if (p.kind === "barrel") barrelBlast(p);
    else if (p.kind === "spawner") { burst(p.x, p.y, 22, "#7a4a8a", 200); banner("HOLE SEALED"); coins += Math.round(12 * P.s.fortune); }
    else if (p.kind === "escort") { burst(p.x, p.y, 26, "#8e2f28", 220); banner("ESCORT LOST"); }
  }
}
function barrelBlast(p) {
  const R = 104, RP = 62, dmgE = 70 * Math.pow(1.3, wave - 1), dmgP = 15 * Math.pow(1.08, wave - 1);
  parts.push({ ring: true, x: p.x, y: p.y, r0: 8, r1: R, t: .32, max: .32 });
  burst(p.x, p.y, 26, "#ffb347", 260);
  if (!reduceMotion) { shake = Math.max(shake, 12); hitStop = Math.max(hitStop, .05); }
  for (const e of enemies) {
    if (!e.dead && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < R * R && hasLOS(p.x, p.y, e.x, e.y)) damage(e, dmgE);
  }
  for (const o of props) {                          // ドラムは連鎖する
    if (o !== p && !o.dead && o.kind === "barrel" && (o.x - p.x) ** 2 + (o.y - p.y) ** 2 < R * R) damageProp(o, 999);
  }
  if ((P.x - p.x) ** 2 + (P.y - p.y) ** 2 < (RP + P.r) ** 2) { P.hp -= dmgP; P.hurtT = .25; }
  for (let ty = ((p.y - R) / TILE) | 0; ty <= ((p.y + R) / TILE) | 0; ty++) {
    for (let tx = ((p.x - R) / TILE) | 0; tx <= ((p.x + R) / TILE) | 0; tx++) {
      if (inMap(tx, ty)) hitWall(tx * TILE + 2, ty * TILE + 2, 40);
    }
  }
}

function updateProps(dt) {
  for (const p of props) {
    if (p.dead) continue;
    if (p.hit) p.hit = Math.max(0, p.hit - dt);

    if (p.kind === "spawner") {
      p.cd -= dt;
      if (p.cd <= 0 && enemies.length < SPAWN_CAP) {
        p.cd = 3.2;
        for (let i = 0; i < 2 + (wave > 8 ? 1 : 0); i++) {
          const e = spawnEnemy(rngW() < .3 ? "runner" : "walker");
          const a = rngW() * 6.2832;
          e.x = p.x + Math.cos(a) * 20; e.y = p.y + Math.sin(a) * 20;
        }
        parts.push({ ring: true, x: p.x, y: p.y, r0: 4, r1: 30, t: .3, max: .3 });
      }
    } else if (p.kind === "point") {
      const inside = (P.x - p.x) ** 2 + (P.y - p.y) ** 2 < p.r * p.r;
      if (inside) {
        p.fill += dt / 6;
        if (p.fill >= 1) {
          p.dead = true; pointCd = 7;
          coins += Math.round(34 * P.s.fortune);
          P.hp = Math.min(P.s.hp, P.hp + P.s.hp * .1);
          banner("SECURED");
          addText(p.x, p.y - 20, "+" + Math.round(34 * P.s.fortune) + " ¤", "#ffc53d");
        }
      } else p.fill = Math.max(0, p.fill - dt / 14);
    } else if (p.kind === "escort") {
      // 流れ場はプレイヤーを指しているので、そのまま追従に使える
      const d = Math.hypot(P.x - p.x, P.y - p.y);
      if (d > 46) {
        flowDir(p.x, p.y, fv);
        let mx = fv.x, my = fv.y;
        if (!mx && !my) { mx = (P.x - p.x) / d; my = (P.y - p.y) / d; }
        moveEnt(p, mx * p.spd * dt, my * p.spd * dt);
      }
      const cx = (p.x / CELL) | 0, cy = (p.y / CELL) | 0;   // 近くの敵に噛まれる
      let bite = 0;
      for (let ox = -2; ox <= 2; ox++) for (let oy = -2; oy <= 2; oy++) {
        const cell = grid.get((cx + ox) + "," + (cy + oy));
        if (!cell) continue;
        for (const e of cell) {
          if (e.dead) continue;
          const rr = e.r + p.r;
          if ((e.x - p.x) ** 2 + (e.y - p.y) ** 2 < rr * rr) bite += e.dmg;
        }
      }
      if (bite > 0) {
        damageProp(p, Math.min(bite, 26 * Math.pow(1.1, wave - 1)) * dt);
        p.calm = 0;
      } else {
        // 敵を引き剥がせば自力で直る＝「引き離す」が正解になる
        p.calm += dt;
        if (p.calm > 1.5) p.hp = Math.min(p.maxHp, p.hp + p.maxHp * .06 * dt);
      }
    }
  }
  if (pointCd > 0) {                                 // 制圧ポイントは少ししたら別の場所に湧く
    pointCd -= dt;
    if (pointCd <= 0) {
      const p = freeSpot(stream("point", wave, time | 0), (P.x / TILE) | 0, (P.y / TILE) | 0, 8);
      if (p) props.push({ kind: "point", x: p.x, y: p.y, r: 76, fill: 0 });
    }
  }
  props = props.filter(p => !p.dead);
}

// 弾・爆発がモノに当たるかを見る（数が少ないので総当たりで足りる）
function hitProps(x, y, dmg, rad) {
  for (const p of props) {
    if (p.dead || p.kind === "point" || p.kind === "escort") continue;   // 味方は撃たない
    const rr = p.r + (rad || 0);
    if ((p.x - x) ** 2 + (p.y - y) ** 2 < rr * rr) { damageProp(p, dmg); return true; }
  }
  return false;
}

function drawProps() {
  for (const p of props) {
    if (p.kind === "point") {
      ctx.strokeStyle = "rgba(255,197,61,.5)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = "#ffc53d"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, -1.5708, -1.5708 + 6.2832 * p.fill); ctx.stroke();
      ctx.fillStyle = "rgba(255,197,61,.10)";
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#ffc53d"; ctx.font = '700 12px "Chakra Petch", sans-serif'; ctx.textAlign = "center";
      ctx.fillText("HOLD " + Math.round(p.fill * 100) + "%", p.x, p.y + 4);
      continue;
    }
    ctx.fillStyle = "rgba(60,40,18,.28)";
    ctx.beginPath(); ctx.ellipse(p.x, p.y + p.r * .5, p.r, p.r * .45, 0, 0, 6.2832); ctx.fill();
    if (p.kind === "barrel") {
      ctx.fillStyle = p.hit ? "#fff" : "#b5471f";
      ctx.fillRect(p.x - 10, p.y - 13, 20, 26);
      ctx.fillStyle = "#f0c14b"; ctx.fillRect(p.x - 10, p.y - 4, 20, 5);
    } else if (p.kind === "spawner") {
      ctx.fillStyle = "#150f18";
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * .8, 0, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = p.hit ? "#fff" : "#a06ad0"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r + 3 + Math.sin(time * 4) * 2, p.r * .8 + 2, 0, 0, 6.2832); ctx.stroke();
    } else if (p.kind === "escort") {
      ctx.fillStyle = p.hit ? "#fff" : "#c9a227";
      ctx.fillRect(p.x - 14, p.y - 10, 28, 20);
      ctx.fillStyle = "#2b2418"; ctx.fillRect(p.x - 14, p.y - 12, 28, 4); ctx.fillRect(p.x - 14, p.y + 8, 28, 4);
    }
    if (p.maxHp && p.hp < p.maxHp) {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(p.x - 16, p.y - p.r - 12, 32, 4);
      ctx.fillStyle = p.kind === "escort" ? "#ffc53d" : "#e15a4c";
      ctx.fillRect(p.x - 16, p.y - p.r - 12, 32 * Math.max(0, p.hp / p.maxHp), 4);
    }
  }
}

function addWeapon(id) {

function wdef(w) { return WEAPONS[w.id]; }
// レベルによる伸び：ダメージは乗算、間隔は短縮、種類ごとに数や範囲も伸びる
// 発射間隔の下限。ここが無いと連射強化を積むだけで毎フレーム発射になる
const RATE_FLOOR = { shot: .10, nova: 1.0, laser: .6, orbit: .12 };
function wstat(w) {
  const d = wdef(w), b = d.base, s = P.s, k = w.lv - 1;
  const sd = s.dmg * (1 + s.dmgAdd);
  const sr = Math.max(.32, s.rate / (1 + s.rateAdd));   // 連射倍率も3倍で頭打ち
  const sa = s.area * (1 + s.areaAdd);
  const o = {
    dmg: b.dmg * (1 + .3 * k) * sd,
    rate: Math.max(RATE_FLOOR[d.kind], b.rate * Math.pow(.93, k) * sr),
    kind: d.kind,
  };
  if (d.kind === "shot") {
    o.spd = b.spd * s.bspd;
    o.pierce = (b.pierce || 0) + (w.lv >= 4 ? 1 : 0);
    o.shots = b.shots + Math.floor(k / 2) + (s.shots | 0);
    o.spread = b.spread;
    o.life = (b.life || .95) * s.bspd;
  } else if (d.kind === "nova") {
    o.radius = b.radius * (1 + .1 * k) * sa;
    o.twin = b.twin;
  } else if (d.kind === "orbit") {
    o.count = b.count + Math.floor(k / 2);
    o.radius = b.radius * sa;
    o.size = b.size * sa;
    o.spin = 2.2 * s.orbSpd;
  } else if (d.kind === "laser") {
    o.width = b.width * sa;
    o.len = b.len;
  }

}
// モノを撃ちに行く距離。武器の射程とは別に、短く持つ（遠くのドラムを勝手に消費しない）
const PROP_REACH = { barrel: 170, spawner: 205 };
// 射線が通る中で最寄りの敵。近い順に数体だけ視線判定する
const CAND = 10;
const candE = new Array(CAND), candD = new Float64Array(CAND);
function nearestEnemy(maxD) {
  // ドラムと湧き穴は敵より優先。ただし武器の射程ではなく「近づいたら」で判定する
  let bestProp = null, bpd = Infinity;
  for (const pr of props) {
    if (pr.dead || (pr.kind !== "barrel" && pr.kind !== "spawner")) continue;
    const reach = PROP_REACH[pr.kind];
    const d = (pr.x - P.x) ** 2 + (pr.y - P.y) ** 2;
    if (d > reach * reach || d >= bpd) continue;
    if (!hasLOS(P.x, P.y, pr.x, pr.y)) continue;
    bpd = d; bestProp = pr;
  }
  if (bestProp) return bestProp;

  let n = 0, worst = maxD * maxD;
  for (const e of enemies) {
    const d = (e.x - P.x) ** 2 + (e.y - P.y) ** 2;
    if (d >= worst && n === CAND) continue;
    if (d >= maxD * maxD) continue;
    let i = Math.min(n, CAND - 1);
    while (i > 0 && candD[i - 1] > d) { candD[i] = candD[i - 1]; candE[i] = candE[i - 1]; i--; }
    candD[i] = d; candE[i] = e;
    if (n < CAND) n++;
    worst = candD[n - 1];
  }
  for (let i = 0; i < n; i++) {
    if (hasLOS(P.x, P.y, candE[i].x, candE[i].y)) return candE[i];
  }
  return null;
}
function fireWeapon(w, st) {
  if (st.kind === "shot") {
    const t = nearestEnemy(620);
    if (!t) return false;
    P.aim = Math.atan2(t.y - P.y, t.x - P.x);
    for (let i = 0; i < st.shots; i++) {
      const off = st.spread >= 6 ? (i / st.shots) * 6.2832 : (i - (st.shots - 1) / 2) * st.spread;
      const a = P.aim + off;
      bullets.push({
        x: P.x + Math.cos(a) * 12, y: P.y + Math.sin(a) * 12,
        vx: Math.cos(a) * st.spd, vy: Math.sin(a) * st.spd,
        dmg: st.dmg, pierce: st.pierce, life: st.life, a, r: 3.4,
      });
    }
    return true;
  }
  if (st.kind === "nova") {
    novaBlast(st.radius, st.dmg);
    if (st.twin) setTimeout(() => { if (running && !over) novaBlast(st.radius * .7, st.dmg * .7); }, 190);
    return true;
  }
  if (st.kind === "laser") {
    const t = nearestEnemy(st.len);
    if (!t) return false;
    const a = Math.atan2(t.y - P.y, t.x - P.x);
    P.aim = a;
    const ux = Math.cos(a), uy = Math.sin(a), half = st.width / 2;
    let len = st.len;                       // 壁で止まる
    const steps = Math.ceil(len / (TILE * .5));
    for (let i = 1; i <= steps; i++) {
      const tt = (i / steps) * st.len;
      if (solidAt(P.x + ux * tt, P.y + uy * tt)) { len = Math.max(0, tt - TILE * .3); break; }
    }
    beams.push({ x: P.x, y: P.y, a, len, width: st.width, t: .16, max: .16 });
    for (const e of enemies) {
      const rx = e.x - P.x, ry = e.y - P.y;
      const proj = rx * ux + ry * uy;
      if (proj < 0 || proj > len) continue;
      const perp = Math.abs(-rx * uy + ry * ux);
      if (perp < half + e.r) damage(e, st.dmg);
    }
    for (const pr of props) {
      if (pr.dead || pr.kind === "point" || pr.kind === "escort") continue;
      const rx = pr.x - P.x, ry = pr.y - P.y, proj = rx * ux + ry * uy;
      if (proj < 0 || proj > len) continue;
      if (Math.abs(-rx * uy + ry * ux) < half + pr.r) damageProp(pr, st.dmg);
    }
    if (!reduceMotion) shake = Math.max(shake, 4);
    return true;
  }
  return false;
}
let ringCount = 0;
function novaBlast(R, dmg) {
  if (ringCount < 6) { parts.push({ ring: true, x: P.x, y: P.y, r0: 10, r1: R, t: .34, max: .34 }); }
  for (const e of enemies) {
    if ((e.x - P.x) ** 2 + (e.y - P.y) ** 2 < R * R && hasLOS(P.x, P.y, e.x, e.y)) damage(e, dmg);
  }
  for (const p of props) {
    if (p.dead || p.kind === "point" || p.kind === "escort") continue;
    if ((p.x - P.x) ** 2 + (p.y - P.y) ** 2 < R * R && hasLOS(P.x, P.y, p.x, p.y)) damageProp(p, dmg);
  }
  if (!reduceMotion) shake = Math.max(shake, 5);
}
function updateOrbits(dt) {
  for (const w of P.weapons) {
    const d = wdef(w);
    if (d.kind !== "orbit") continue;
    const st = wstat(w);
    w.ang += st.spin * dt;
    for (let i = 0; i < st.count; i++) {
      const a = w.ang + (i / st.count) * 6.2832;
      const bx = P.x + Math.cos(a) * st.radius, by = P.y + Math.sin(a) * st.radius;
      if (solidAt(bx, by)) continue;              // 刃が壁に埋まっている間は当たらない
      const cx = (bx / CELL) | 0, cy = (by / CELL) | 0;
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const cell = grid.get((cx + ox) + "," + (cy + oy));
        if (!cell) continue;
        for (const e of cell) {
          if (e.dead || e.orbCd > 0) continue;
          const rr = e.r + st.size;
          if ((e.x - bx) ** 2 + (e.y - by) ** 2 < rr * rr) { damage(e, st.dmg); e.orbCd = st.rate; }
        }

    }
  }

function readInput() {
  let dx = 0, dy = 0;
  if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  if (keys.has("w") || keys.has("arrowup")) dy -= 1;
  if (keys.has("s") || keys.has("arrowdown")) dy += 1;
  if (stick) {
    const sx = stick.x - stick.ox, sy = stick.y - stick.oy, d = Math.hypot(sx, sy);
    if (d > 8) { const k = Math.min(d, 56) / 56 / d; dx += sx * k; dy += sy * k; }
  }
  const m = Math.hypot(dx, dy);
  return m > 1 ? { x: dx / m, y: dy / m } : { x: dx, y: dy };
}

const fv = { x: 0, y: 0 };
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.random() * arr.length | 0]; }

// --- seeded streams: 同じシードなら同じ湧き方・同じ品揃えになる ---
function hash32(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// ラベルごとに独立した流れを作る＝引き直し回数が違っても品揃えは全員同じ
function stream(...parts) { return mulberry32(hash32(runSeed + "|" + parts.join("|"))); }
function randW(a, b) { return a + rngW() * (b - a); }
function pickR(r, arr) { return arr[r() * arr.length | 0]; }
function todaySeed() {

}

}

}

function spawnRing() {
  // 画面外の通れるマスを狙う。部屋が狭いときは遠い空きマスへ落とす
  for (let t = 0; t < 14; t++) {
    const a = rngW() * 6.2832;
    const d = Math.max(W, H) * .55 + randW(10, 70);
    const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
    const mcx = mapW() / 2, mcy = mapH() / 2;
    if (x > TILE * 2 && y > TILE * 2 && x < mapW() - TILE * 2 && y < mapH() - TILE * 2
        && Math.hypot(x - mcx, y - mcy) < collapseR() * .96 && !solidAt(x, y)) {
      return { x, y };
    }
  }
  for (let t = 0; t < 60; t++) {
    const x = randW(TILE * 3, mapW() - TILE * 3), y = randW(TILE * 3, mapH() - TILE * 3);
    if (!solidAt(x, y) && (x - P.x) ** 2 + (y - P.y) ** 2 > 260 * 260) return { x, y };
  }

}
function spawnEnemy(kind) {

  const t = TYPES[kind], p = spawnRing(), scale = Math.pow(1.31, wave - 1);
  const e = {

function spawnRate() {

  let holes = 0;

function endWave() {

function damage(e, dmg) {
  let crit = false;
  if (Math.random() < P.s.crit) { dmg *= P.s.critDmg; crit = true; }
  e.hp -= dmg; e.hit = .11;
  if (e.hp <= 0) { killEnemy(e); return; }
  if (crit || e.kind === "boss") addText(e.x, e.y - e.r - 6, Math.round(dmg), crit ? "#ffe08a" : "#ffd9a0");
}
let explDepth = 0;
function explode(e) {
  const R = 54;
  parts.push({ ring: true, x: e.x, y: e.y, r0: 6, r1: R, t: .26, max: .26 });
  burst(e.x, e.y, 10, "#e2a33c", 190);
  if ((P.x - e.x) ** 2 + (P.y - e.y) ** 2 < (R + P.r) ** 2) {
    P.hp -= 14 * Math.pow(1.11, wave - 1); P.hurtT = .22;
    if (!reduceMotion) shake = Math.max(shake, 7);
  }
  for (const o of props) {
    if (!o.dead && o.kind !== "point" && (o.x - e.x) ** 2 + (o.y - e.y) ** 2 < R * R) damageProp(o, 40);
  }
  if (explDepth > 3) return;              // 自爆の連鎖は3段まで
  explDepth++;
  const dmg = 30 * Math.pow(1.28, wave - 1);
  for (const o of enemies) {
    if (o.dead || o === e) continue;
    if ((o.x - e.x) ** 2 + (o.y - e.y) ** 2 < R * R && hasLOS(e.x, e.y, o.x, o.y)) damage(o, dmg);
  }
  explDepth--;
}
function killEnemy(e) {
  e.dead = true; kills++;
  if (TYPES[e.kind].boom) explode(e);
  burst(e.x, e.y, e.kind === "boss" ? 34 : 4, "#8e2f28", e.kind === "boss" ? 260 : 120);
  if (P.s.leech) {
    P.killStreak++;
    if (P.killStreak >= 10) { P.killStreak = 0; P.hp = Math.min(P.s.hp, P.hp + P.s.leech); }
  }
  const n = e.kind === "boss" ? 26 : e.kind === "brute" ? 4 : 1;
  for (let i = 0; i < n; i++) {
    drops.push({
      x: e.x + rand(-e.r, e.r), y: e.y + rand(-e.r, e.r),
      vx: rand(-40, 40), vy: rand(-40, 40),
      xp: e.xp / n, coin: rngW() < .45 || e.kind === "boss",
    });
  }
  if (e === boss) {
    boss = null; banner("BOSS DOWN");
    P.hp = Math.min(P.s.hp, P.hp + 12);
    if (!reduceMotion) { shake = 16; hitStop = .1; }
  }
}
function gainXp(v) {
  P.xp += v * P.s.xpMul;
  while (P.xp >= P.xpNext) {
    P.xp -= P.xpNext; P.lv++;
    P.xpNext = Math.floor(8 + P.lv * 5.2 + P.lv * P.lv * .32);
    queueLevelUp();
  }
}

// =====================================================================
//  update
// =====================================================================
function update(dt) {
  time += dt; waveT -= dt;

  const inp = readInput();
  const pfl = floorAt(P.x, P.y);
  const spd = P.spd * Math.min(1.8, P.s.move * (1 + P.s.moveAdd)) * (pfl === FLOOR.SWAMP ? .68 : 1);
  const accel = pfl === FLOOR.ICE ? 1.8 : 16;        // 氷は止まれない
  const k = Math.min(1, accel * dt);
  P.vx += (inp.x * spd - P.vx) * k;
  P.vy += (inp.y * spd - P.vy) * k;
  moveEnt(P, P.vx * dt, P.vy * dt);
  if (pfl === FLOOR.POISON) { P.hp -= 3.5 * Math.pow(1.12, wave - 1) * dt; P.hurtT = .12; }
  // 外周は崩落していて長居できない＝マップを作り直さずに戦場を狭めていく
  if (Math.hypot(P.x - mapW() / 2, P.y - mapH() / 2) > collapseR()) {
    P.hp -= 9 * Math.pow(1.09, wave - 1) * dt;
    P.hurtT = .16;
  }
  P.hurtT = Math.max(0, P.hurtT - dt);

  // 流れ場はプレイヤーがマスを移ったときだけ作り直せば足りる
  flowT -= dt;
  const ptile = (((P.y / TILE) | 0) * MW) + ((P.x / TILE) | 0);
  if (ptile !== flowTile || flowT <= 0) { rebuildFlow(); flowT = .5; }
  if (P.s.regen) P.hp = Math.min(P.s.hp, P.hp + P.s.regen * dt);

  // spawn
  spawnAcc += spawnRate() * dt;
  while (spawnAcc >= 1) {
    spawnAcc -= 1;
    if (enemies.length >= SPAWN_CAP) break;
    const r = rngW();
    let kind = "walker";
    if (wave >= 6 && r < .04) kind = "flyer";
    else if (wave >= 5 && r < .08 && liveMason < 3) kind = "mason";
    else if (wave >= 4 && r < .13 && liveBreak < 4) kind = "breaker";
    else if (wave >= 5 && r < .17) kind = "bomber";
    else if (wave >= 3 && r < .24 && liveSpit < 4 + wave) kind = "spitter";
    else if (wave >= 3 && r < .31) kind = "brute";
    else if (wave >= 2 && r < .55) kind = "runner";
    spawnEnemy(kind);
  }
  const bossWave = wave >= 7 ? true : wave % 2 === 0;
  if (bossWave && !bossSpawned && waveT < WAVE_LEN - 4) { bossSpawned = true; spawnBoss(); }

  // spatial hash
  grid = new Map();
  for (const e of enemies) {
    const key = ((e.x / CELL) | 0) + "," + ((e.y / CELL) | 0);
    let cell = grid.get(key);
    if (!cell) grid.set(key, cell = []);
    cell.push(e);
  }

  // separation (own cell only — cheap, enough to read as a wall)
  for (const cell of grid.values()) {
    const n = Math.min(cell.length, 10);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const a = cell[i], b = cell[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const min = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 > min * min || d2 === 0) continue;
      const d = Math.sqrt(d2), push = (min - d) * .5;
      dx /= d; dy /= d;
      a.x -= dx * push; a.y -= dy * push;
      b.x += dx * push; b.y += dy * push;
    }
  }

  // weapons
  for (const w of P.weapons) {
    const d = wdef(w);
    if (d.kind === "orbit") continue;
    const st = wstat(w);
    w.cd -= dt;
    if (w.cd <= 0) { if (fireWeapon(w, st)) w.cd += st.rate; else w.cd = .1; }
  }
  updateOrbits(dt);

  updateProps(dt);

  // enemies
  const despawn = Math.hypot(mapW(), mapH()) + 300;   // 部屋が有限なので実質無効
  let contact = 0, nSpit = 0, nMason = 0, nBreak = 0;
  for (const e of enemies) {
    let dx = P.x - e.x, dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > despawn) { e.dead = true; continue; }
    e.ph += dt * 6;
    const wob = e.kind === "boss" ? 0 : Math.sin(e.ph) * .22;
    dx /= d; dy /= d;
    const T = TYPES[e.kind];
    if (T.range) nSpit++; else if (T.mason) nMason++; else if (T.breaker) nBreak++;
    if (e.kind === "boss") {
      e.fireCd -= dt;
      if (e.fireCd <= 0) {                 // 周囲に弾をばら撒く。避けるしかない
        e.fireCd = 4.2;
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * 6.2832 + Math.random() * .2;
          eshots.push({ x: e.x, y: e.y, vx: Math.cos(a) * 142, vy: Math.sin(a) * 142, dmg: e.dmg * .32, life: 4 });
        }
        if (!reduceMotion) shake = Math.max(shake, 6);
      }
    }
    // 視線が通れば直進、通らなければ流れ場を下る＝壁を回り込んで最短で来る
    e.losT -= dt;
    if (e.losT <= 0) { e.los = T.fly || hasLOS(e.x, e.y, P.x, P.y); e.losT = .18 + Math.random() * .18; }
    let mx, my;
    if (e.los) { mx = dx - dy * wob; my = dy + dx * wob; }
    else {
      flowDir(e.x, e.y, fv);
      mx = fv.x; my = fv.y;
      if (!mx && !my) { mx = dx; my = dy; }
    }
    const efl = floorAt(e.x, e.y);
    const esp = e.spd * (efl === FLOOR.SWAMP ? .8 : 1);
    if (efl === FLOOR.THORN) {
      e.thornT -= dt;
      if (e.thornT <= 0) { e.thornT = .5; damage(e, e.maxHp * .04); if (e.dead) continue; }
    }
    if (T.fly) {                       // 飛行：壁も床も無視する
      e.x += mx * esp * dt; e.y += my * esp * dt;
    } else if (T.range) {
      // 射手は間合いを取って撃つ。立ち止まると当たる＝動く理由になる
      const closing = d > T.range ? 1 : d < T.range * .75 ? -.7 : 0;
      moveEnt(e, (mx * closing - my * .5) * esp * dt, (my * closing + mx * .5) * esp * dt);
      e.fireCd -= dt;
      if (e.fireCd <= 0 && e.los && d < T.range * 1.5) {
        e.fireCd = 2.8;
        eshots.push({ x: e.x, y: e.y, vx: dx * 185, vy: dy * 185, dmg: e.dmg * 1.6, life: 3 });
      }
    } else {
      moveEnt(e, mx * esp * dt, my * esp * dt);
      // 壊し屋：進路の壊せる壁を削って道をこじ開ける
      if (T.breaker) hitWall(e.x + mx * (e.r + 9), e.y + my * (e.r + 9), 36 * Math.pow(1.12, wave - 1) * dt);
      // 石工：プレイヤーの近くに壁を建てて逃げ道を塞ぐ
      if (T.mason) {
        e.buildCd -= dt;
        if (e.buildCd <= 0 && d < 340) {
          e.buildCd = 4.5;
          const a = Math.random() * 6.2832, rr = 60 + Math.random() * 70;
          const tx = ((P.x + Math.cos(a) * rr) / TILE) | 0, ty = ((P.y + Math.sin(a) * rr) / TILE) | 0;
          const ptx = (P.x / TILE) | 0, pty = (P.y / TILE) | 0;
          if (inMap(tx, ty) && !solid[idx(tx, ty)] && !(tx === ptx && ty === pty)) {
            solid[idx(tx, ty)] = 2;
            wallHp[idx(tx, ty)] = 20 * Math.pow(1.16, wave - 1);
            flowTile = -1;
            parts.push({ ring: true, x: tx * TILE + 13, y: ty * TILE + 13, r0: 4, r1: 24, t: .3, max: .3 });
          }
        }
      }
    }
    e.hit = Math.max(0, e.hit - dt);
    e.orbCd = Math.max(0, e.orbCd - dt);
    if (d < e.r + P.r) {
      contact += e.dmg;
      if (e.kind !== "boss") { const push = (e.r + P.r - d) * .9; e.x -= dx * push; e.y -= dy * push; }
    }
  }
  liveSpit = nSpit; liveMason = nMason; liveBreak = nBreak;
  if (contact > 0) {
    P.hp -= Math.min(contact, 13 * Math.pow(1.15, wave - 1)) * dt;
    P.hurtT = .18;
    if (P.hp <= 0) { gameOver(); return; }
  }

  // bullets
  for (const b of bullets) {
    b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    // 1フレームの移動が1マスを超えると薄い壁をすり抜けてしまうので、細かく刻んで進める
    const travel = Math.hypot(b.vx, b.vy) * dt;
    const sub = Math.max(1, Math.ceil(travel / (TILE * .5)));
    for (let k = 0; k < sub && !b.dead; k++) {
      b.x += b.vx * dt / sub; b.y += b.vy * dt / sub;
      if (hitProps(b.x, b.y, b.dmg, b.r)) { b.dead = true; break; }
      if (solidAt(b.x, b.y)) {
        hitWall(b.x, b.y, b.dmg);
        b.dead = true; burst(b.x, b.y, 2, "#cbb894", 60); break;
      }
      const cx = (b.x / CELL) | 0, cy = (b.y / CELL) | 0;
      for (let ox = -1; ox <= 1 && !b.dead; ox++) for (let oy = -1; oy <= 1 && !b.dead; oy++) {
        const cell = grid.get((cx + ox) + "," + (cy + oy));
        if (!cell) continue;
        for (const e of cell) {
          if (e.dead) continue;
          const rr = e.r + b.r;
          if ((e.x - b.x) ** 2 + (e.y - b.y) ** 2 < rr * rr) {
            damage(e, b.dmg * e.armor);
            burst(b.x, b.y, 2, "#bff7f0", 90);
            if (b.pierce-- <= 0) { b.dead = true; break; }
          }
        }
      }
    }
  }

  // drops
  for (const g of drops) {
    const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy) || 1;
    if (d < P.s.magnet) {
      const pull = 60 + (P.s.magnet - d) * 9;
      g.vx += (dx / d) * pull * dt * 6; g.vy += (dy / d) * pull * dt * 6;
    }
    g.vx *= .92; g.vy *= .92;
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (d < P.r + 5) {
      g.dead = true;
      gainXp(g.xp);
      if (g.coin) coins += Math.round(2 * P.s.fortune);
    }
  }

  for (const b of beams) { b.t -= dt; if (b.t <= 0) b.dead = true; }
  for (const q of eshots) {
    q.life -= dt;
    if (q.life <= 0) { q.dead = true; continue; }
    const qt = Math.hypot(q.vx, q.vy) * dt;
    const qs = Math.max(1, Math.ceil(qt / (TILE * .5)));
    for (let k = 0; k < qs && !q.dead; k++) {
      q.x += q.vx * dt / qs; q.y += q.vy * dt / qs;
      if (solidAt(q.x, q.y)) q.dead = true;
    }
    if (q.dead) continue;
    if ((q.x - P.x) ** 2 + (q.y - P.y) ** 2 < (P.r + 6) ** 2) {
      q.dead = true; P.hp -= q.dmg; P.hurtT = .22;
      burst(q.x, q.y, 4, "#b6d84a", 120);
    }
  }
  ringCount = 0;
  for (const p of parts) {
    p.t -= dt;
    if (p.t <= 0) { p.dead = true; continue; }
    if (p.ring) ringCount++;
    if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .9; p.vy *= .9; }
  }
  for (const t of texts) { t.t -= dt; t.y -= 26 * dt; if (t.t <= 0) t.dead = true; }

  const alive = a => !a.dead;
  enemies = enemies.filter(alive);
  bullets = bullets.filter(alive);
  beams = beams.filter(alive);
  eshots = eshots.filter(alive);
  drops = drops.filter(alive);
  parts = parts.filter(alive);
  texts = texts.filter(alive);
  if (shake > 0) shake = Math.max(0, shake - dt * 42);

  if (P.hp <= 0 && !over) { gameOver(); return; }
  if (waveT <= 0) endWave();
}

// =====================================================================
//  render
// =====================================================================
function draw() {
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  let camX = P.x - W / 2 + sx, camY = P.y - H / 2 + sy;
  const MAR = 90;                       // 端でもプレイヤーが画面の縁に貼り付かないように
  camX = mapW() <= W ? (mapW() - W) / 2 : Math.max(-MAR, Math.min(mapW() - W + MAR, camX));
  camY = mapH() <= H ? (mapH() - H) / 2 : Math.max(-MAR, Math.min(mapH() - H + MAR, camY));

  ctx.save();
  ctx.translate(-camX, -camY);
  ctx.fillStyle = "#0d0b09";
  ctx.fillRect(camX, camY, W, H);
  ctx.fillStyle = groundPat;
  ctx.fillRect(0, 0, mapW(), mapH());

  // 見えている範囲のマスだけ描く
  const t0x = Math.max(0, (camX / TILE) | 0), t1x = Math.min(MW - 1, ((camX + W) / TILE) | 0);
  const t0y = Math.max(0, (camY / TILE) | 0), t1y = Math.min(MH - 1, ((camY + H) / TILE) | 0);
  for (let ty = t0y; ty <= t1y; ty++) {
    for (let tx = t0x; tx <= t1x; tx++) {
      const i = idx(tx, ty), x = tx * TILE, y = ty * TILE;
      const f = ground[i];
      if (f) {
        ctx.globalAlpha = .68;
        ctx.fillStyle = FLOOR_COL[f];
        ctx.fillRect(x, y, TILE, TILE);
        ctx.globalAlpha = 1;
        // ふちを光らせて「区画」として読ませる
        ctx.fillStyle = FLOOR_EDGE[f];
        if (!inMap(tx, ty - 1) || ground[idx(tx, ty - 1)] !== f) ctx.fillRect(x, y, TILE, 2);
        if (!inMap(tx, ty + 1) || ground[idx(tx, ty + 1)] !== f) ctx.fillRect(x, y + TILE - 2, TILE, 2);
        if (!inMap(tx - 1, ty) || ground[idx(tx - 1, ty)] !== f) ctx.fillRect(x, y, 2, TILE);
        if (!inMap(tx + 1, ty) || ground[idx(tx + 1, ty)] !== f) ctx.fillRect(x + TILE - 2, y, 2, TILE);
      }
      if (solid[i]) {
        const brk = solid[i] === 2;
        ctx.fillStyle = brk ? "#4a3520" : "#332c22";
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = brk ? "#7d5c32" : "#514637";
        ctx.fillRect(x, y, TILE, 6);
        if (brk) {
          ctx.fillStyle = "rgba(20,14,8,.55)";
          ctx.fillRect(x + 5, y + 9, TILE - 10, 2);
          ctx.fillRect(x + 9, y + 15, 3, TILE - 18);
        }
        ctx.fillStyle = "rgba(0,0,0,.3)";
        ctx.fillRect(x, y + TILE - 5, TILE, 5);
      }
    }
  }

  {
    const CR = collapseR(), mcx = mapW() / 2, mcy = mapH() / 2;
    ctx.save();
    ctx.beginPath();
    ctx.rect(camX, camY, W, H);
    ctx.arc(mcx, mcy, CR, 0, 6.2832, true);
    ctx.fillStyle = "rgba(126,28,12,.32)";
    ctx.fill("evenodd");
    ctx.restore();
    ctx.strokeStyle = "rgba(255,124,58,.5)";
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mcx, mcy, CR, 0, 6.2832); ctx.stroke();
  }

  drawProps();

  for (const g of drops) {
    ctx.fillStyle = g.coin ? "#ffc53d" : "#46e0d2";
    ctx.fillRect(g.x - 2.5, g.y - 2.5, 5, 5);
  }

  ctx.strokeStyle = "rgba(70,224,210,.14)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(P.x, P.y, P.s.magnet, 0, 6.2832); ctx.stroke();

  ctx.fillStyle = "rgba(60,40,18,.22)";
  for (const e of enemies) {
    ctx.beginPath(); ctx.ellipse(e.x, e.y + e.r * .55, e.r * 1.05, e.r * .5, 0, 0, 6.2832); ctx.fill();
  }
  for (const e of enemies) {
    const t = TYPES[e.kind];
    ctx.fillStyle = e.hit > 0 ? "#fff3e0" : t.col;
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = e.hit > 0 ? "#fff" : t.head;
    ctx.beginPath(); ctx.arc(e.x, e.y - e.r * .45, e.r * .48, 0, 6.2832); ctx.fill();
    if (e.kind === "boss") {
      ctx.strokeStyle = "#c6f57a"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r + 4, 0, 6.2832); ctx.stroke();
    }
  }

  // beams
  for (const b of beams) {
    const k = b.t / b.max;
    ctx.strokeStyle = `rgba(143,245,234,${k * .85})`;
    ctx.lineWidth = b.width * k;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x + Math.cos(b.a) * b.len, b.y + Math.sin(b.a) * b.len);
    ctx.stroke();
  }

  // enemy shots
  for (const q of eshots) {
    ctx.fillStyle = "#39481f";
    ctx.beginPath(); ctx.arc(q.x, q.y, 7, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#b6d84a";
    ctx.beginPath(); ctx.arc(q.x, q.y, 4.5, 0, 6.2832); ctx.fill();
  }

  // bullets (one batched stroke)
  ctx.lineCap = "round";
  ctx.strokeStyle = "#8ff5ea"; ctx.lineWidth = 5;
  ctx.beginPath();
  for (const b of bullets) {
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - Math.cos(b.a) * 13, b.y - Math.sin(b.a) * 13);
  }
  ctx.stroke();

  // orbit blades
  for (const w of P.weapons) {
    const d = wdef(w);
    if (d.kind !== "orbit") continue;
    const st = wstat(w);
    ctx.fillStyle = "#c9f7f1"; ctx.strokeStyle = "rgba(70,224,210,.5)"; ctx.lineWidth = 2;
    for (let i = 0; i < st.count; i++) {
      const a = w.ang + (i / st.count) * 6.2832;
      const bx = P.x + Math.cos(a) * st.radius, by = P.y + Math.sin(a) * st.radius;
      ctx.beginPath(); ctx.arc(bx, by, st.size, 0, 6.2832); ctx.fill();
    }
  }

  // player
  ctx.fillStyle = "rgba(60,40,18,.28)";
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 8, 14, 6, 0, 0, 6.2832); ctx.fill();
  ctx.save();
  ctx.translate(P.x, P.y); ctx.rotate(P.aim);
  ctx.fillStyle = P.hurtT > 0 ? "#ffb4a8" : "#3d63c9";
  ctx.fillRect(-10, -9, 20, 18);
  ctx.fillStyle = "#7fa4ff"; ctx.fillRect(2, -6, 12, 12);
  ctx.fillStyle = "#1b2438"; ctx.fillRect(-11, -11, 7, 5); ctx.fillRect(-11, 6, 7, 5);
  ctx.restore();

  for (const p of parts) {
    if (p.ring) {
      const k = 1 - p.t / p.max;
      ctx.strokeStyle = `rgba(143,245,234,${(1 - k) * .8})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r0 + (p.r1 - p.r0) * k, 0, 6.2832); ctx.stroke();
    } else {
      ctx.fillStyle = p.col;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.t * 3));
      ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
      ctx.globalAlpha = 1;
    }
  }

  ctx.font = "700 12px Chakra Petch, sans-serif";
  ctx.textAlign = "center";
  for (const t of texts) {
    ctx.globalAlpha = Math.min(1, t.t * 2.4);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .38, W / 2, H / 2, H * .78);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(20,12,4,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  if (stick) {
    const dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy) || 1, k = Math.min(d, 56) / d;
    ctx.strokeStyle = "rgba(243,233,216,.30)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, 56, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = "rgba(243,233,216,.5)";
    ctx.beginPath(); ctx.arc(stick.ox + dx * k, stick.oy + dy * k, 20, 0, 6.2832); ctx.fill();
  }
}

function rarityRoll(rs) {
  const luck = P.s.luck;
  const r = rs() * (100 + luck * 14) + Math.min(wave * 1.5, 22);
  if (r > 96) return 3;
  if (r > 82) return 2;
  if (r > 55) return 1;
  return 0;
}
function priceOf(offer) {
  const infl = 1 + (wave - 1) * .22;
  if (offer.type === "weapon") {
    const owned = P.weapons.find(w => w.id === offer.id);
    const base = WEAPONS[offer.id].price;
    return Math.round((owned ? base * (.7 + owned.lv * .55) : base) * infl);
  }
  return Math.round(RAR_PRICE[ITEMS.find(i => i.id === offer.id).rar] * infl);
}
function rollOffer(rs) {
  const weaponIds = Object.keys(WEAPONS).filter(k => !WEAPONS[k].evolved);
  const wantWeapon = rs() < .45;
  if (wantWeapon) {
    // 手持ちの強化か、空きスロットへの新規
    const upgradable = P.weapons.filter(w => !WEAPONS[w.id].evolved && w.lv < WMAX).map(w => w.id);
    const fresh = P.weapons.length < SLOTS ? weaponIds.filter(k => !P.weapons.some(w => w.id === k)) : [];
    const poolW = upgradable.concat(fresh);
    if (poolW.length) return { type: "weapon", id: pickR(rs, poolW) };
  }
  const rar = rarityRoll(rs);
  let poolI = ITEMS.filter(i => i.rar === rar);
  if (!poolI.length) poolI = ITEMS;
  return { type: "item", id: pickR(rs, poolI).id };
}
function rollOffers() {
  const rs = stream("shop", wave, rerolls);           // ウェーブと引き直し回数で決まる
  offers = [];
  for (let i = 0; i < 4; i++) {
    let o = null;
    for (let tries = 0; tries < 8; tries++) {        // 同じ品を並べない
      o = rollOffer(rs);
      if (!offers.some(x => x.type === o.type && x.id === o.id)) break;
    }
    offers.push(o);
  }
  renderShop();
}
function renderShop() {
  el("shopCoins").textContent = coins;
  el("shopTitle").textContent = `WAVE ${wave} 終了 ─ 補給`;
  const cost = rerollCost();

  el("rerollBtn").disabled = rerollsLeft <= 0 || cost > coins;
  const box = el("shopCards");
  box.innerHTML = "";
  offers.forEach((o, idx) => {
    if (o.bought) return;
    const price = priceOf(o);
    const b = document.createElement("button");
    b.className = "card";
    b.disabled = price > coins;
    if (o.type === "weapon") {
      const d = WEAPONS[o.id], owned = P.weapons.find(w => w.id === o.id);
      const key = EVOLUTIONS.find(e => e.from === o.id);
      const evoNote = key ? `<br>MAX＋${ITEMS.find(i => i.id === key.key).name} → <b>${WEAPONS[key.to].name}</b>` : "";
      b.innerHTML = `<span class="glyph rr">${d.glyph}</span>
        <span><h3>${d.name}${owned ? ` <span class="tag">LV${owned.lv}→${owned.lv + 1}</span>` : ` <span class="tag">新規</span>`}</h3>
        <small>${d.desc}${evoNote}</small></span>
        <span class="tail"><span class="price">${price}¤</span></span>`;
    } else {
      const it = ITEMS.find(i => i.id === o.id);
      b.className += " b" + RAR_CLASS[it.rar];
      b.innerHTML = `<span class="glyph r${RAR_CLASS[it.rar]}">◆</span>
        <span><h3>${it.name}</h3><small>${it.desc}</small></span>
        <span class="tail"><span class="price">${price}¤</span><br><span class="tag r${RAR_CLASS[it.rar]}">${RAR_NAME[it.rar]}</span></span>`;
    }
    b.onclick = () => buy(idx);
    box.appendChild(b);
  });
  if (!box.children.length) {
    const p = document.createElement("p");
    p.textContent = "売り切れ。引き直すか、次のウェーブへ。";
    box.appendChild(p);
  }
  drawSlots();
  const inv = el("shopInv");
  inv.innerHTML = "";
  for (const w of P.weapons) {

    c.textContent = `${d.name} ${w.lv}`;
    inv.appendChild(c);
  }
  const counted = {};
  for (const id of P.items) counted[id] = (counted[id] | 0) + 1;
  for (const id in counted) {
    const it = ITEMS.find(x => x.id === id);
    const c = document.createElement("span");
    c.className = "chip";
    c.textContent = it.name + (counted[id] > 1 ? " ×" + counted[id] : "");
    inv.appendChild(c);
  }
}
function buy(idx) {
  const o = offers[idx];
  const price = priceOf(o);
  if (price > coins || o.bought) return;
  coins -= price; o.bought = true;
  if (o.type === "weapon") {
    const owned = P.weapons.find(w => w.id === o.id);
    if (owned) owned.lv = Math.min(WMAX, owned.lv + 1);
    else if (P.weapons.length < SLOTS) addWeapon(o.id);
  } else {
    const it = ITEMS.find(i => i.id === o.id);
    P.items.push(it.id);
    it.apply(P.s);
    P.hp = Math.min(P.s.hp, P.hp);
  }
  checkEvolution();
  renderShop();
}

function chipRow(g, list, x, y, maxW, size) {
  let cx = x, cy = y;
  g.font = `600 ${size}px "Chakra Petch", sans-serif`;
  g.textAlign = "left"; g.textBaseline = "middle";
  for (const it of list) {
    const w = g.measureText(it.t).width + 34;
    if (cx + w > x + maxW) { cx = x; cy += size + 26; }
    g.fillStyle = "#141210"; g.fillRect(cx, cy, w, size + 18);
    g.strokeStyle = it.evo ? "#ffc53d" : "#4a3d2d"; g.lineWidth = 2;
    g.strokeRect(cx + 1, cy + 1, w - 2, size + 16);
    g.fillStyle = it.evo ? "#ffc53d" : it.dim ? "#a2947f" : "#46e0d2";
    g.fillText(it.t, cx + 17, cy + (size + 18) / 2);
    cx += w + 10;
  }
  return cy + size + 18;
}

window.__horde = {
  get enemies() { return enemies.length; },
  get hp() { return Math.round(P.hp); },
  get maxhp() { return Math.round(P.s.hp); },
  get weapons() { return P.weapons.map(w => w.id + ":" + w.lv).join(","); },
  get items() { return P.items.join(","); },
  get bank() { return save.bank; },
  get seed() { return runSeed; },
  get props() { return props.map(p => p.kind).join(","); },
  get escort() { const e = props.find(x => x.kind === "escort" && !x.dead); return e ? e.hp / e.maxHp : null; },
  // 自動テスト用：近くの脅威から離れる向きを返す
  get avoid() {
    let ax = 0, ay = 0;
    for (const e of enemies) {
      const dx = P.x - e.x, dy = P.y - e.y, d2 = dx * dx + dy * dy;
      if (d2 > 240 * 240 || d2 === 0) continue;
      const w = 1 / d2 * (e.kind === "boss" ? 9 : 1);
      ax += dx * w; ay += dy * w;
    }
    for (const q of eshots) {
      const dx = P.x - q.x, dy = P.y - q.y, d2 = dx * dx + dy * dy;
      if (d2 > 150 * 150 || d2 === 0) continue;
      ax += dx / d2 * .5; ay += dy / d2 * .5;
    }
    // 壁からも離れる（テスト用ボットが角に詰まらないように）
    const pt = { x: (P.x / TILE) | 0, y: (P.y / TILE) | 0 };
    for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
      const tx = pt.x + ox, ty = pt.y + oy;
      if (!inMap(tx, ty) || !solid[idx(tx, ty)]) continue;
      const dx = P.x - (tx * TILE + 13), dy = P.y - (ty * TILE + 13);
      const d2 = dx * dx + dy * dy || 1;
      ax += dx / d2 * 6; ay += dy / d2 * 6;
    }
    const CR = collapseR(), mcx = mapW() / 2, mcy = mapH() / 2;
    const dc = Math.hypot(P.x - mcx, P.y - mcy);
    if (dc > CR * .82) {
      const w = (dc - CR * .82) / (CR * .18) * .02;
      ax += (mcx - P.x) / dc * w; ay += (mcy - P.y) / dc * w;
    }
    const m = Math.hypot(ax, ay) || 1;
    return { x: ax / m, y: ay / m };
  },
  get daily() { return dailyMode; },
};
})();
